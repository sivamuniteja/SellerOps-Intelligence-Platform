# SellerOps Intelligence Platform Configuration

project:
  name: "SellerOps Intelligence Platform"
  version: "1.0.0"
  description: "Enterprise multi-sided marketplace operations, SLA, dispute, commission, and reconciliation engine."
  seed: 20261022

currency:
  code: "INR"
  symbol: "₹"
  locale: "en_IN"
  minor_unit: "paise"
  decimal_places: 2
  grouping: "Indian"
  default_timezone: "Asia/Kolkata"

database:
  default_path: "data/sellerops.db"
  starter_path: "data/starter/sellerops_starter.db"
  full_path: "data/full/sellerops_full.db"
  timeout_seconds: 30

dataset_targets:
  starter:
    sellers: 50
    customers: 250
    listings: 500
    orders: 2000
    disputes: 200
  full:
    sellers: 2000
    customers: 10000
    listings: 20000
    orders: 100000
    disputes: 10000

business_rules:
  # Configurable demonstration business parameters (Not official YottaFlex policies)
  default_commission_rate: 0.10
  fixed_handling_fee_paise: 30  # 30 paise
  min_commission_paise: 50      # 50 paise floor
  min_payout_threshold_paise: 2500 # ₹25.00
  payout_frequency_days: 7
  high_risk_surcharge_rate: 0.05
  sla:
    dispatch_window_hours: 48
    max_late_shipment_rate: 0.040
    max_cancellation_rate: 0.025
    max_order_defect_rate: 0.010
    min_seller_rating: 4.2

categories:
  - name: "Electronics"
    base_commission_rate: 0.08
    min_commission_paise: 50
    return_window_days: 14
  - name: "Fashion & Apparel"
    base_commission_rate: 0.15
    min_commission_paise: 50
    return_window_days: 30
  - name: "Home & Kitchen"
    base_commission_rate: 0.12
    min_commission_paise: 50
    return_window_days: 30
  - name: "Beauty & Personal Care"
    base_commission_rate: 0.14
    min_commission_paise: 50
    return_window_days: 14
  - name: "Sports & Outdoors"
    base_commission_rate: 0.10
    min_commission_paise: 50
    return_window_days: 30
  - name: "Books & Media"
    base_commission_rate: 0.15
    min_commission_paise: 50
    return_window_days: 14
  - name: "Automotive"
    base_commission_rate: 0.10
    min_commission_paise: 50
    return_window_days: 30
  - name: "Health & Wellness"
    base_commission_rate: 0.125
    min_commission_paise: 50
    return_window_days: 14

seller_tiers:
  ENTERPRISE:
    commission_discount: 0.02
    reserve_rate: 0.05
    hold_days: 7
    min_volume_paise: 5000000
  PREFERRED:
    commission_discount: 0.01
    reserve_rate: 0.08
    hold_days: 14
    min_volume_paise: 1000000
  STANDARD:
    commission_discount: 0.00
    reserve_rate: 0.10
    hold_days: 14
    min_volume_paise: 0
  PROBATION:
    commission_discount: -0.02
    reserve_rate: 0.20
    hold_days: 30
    min_volume_paise: 0
  SUSPENDED:
    commission_discount: 0.00
    reserve_rate: 1.00
    hold_days: 90
    min_volume_paise: 0

sla_thresholds:
  dispatch_window_hours: 48
  max_late_shipment_rate: 0.040
  max_cancellation_rate: 0.025
  max_order_defect_rate: 0.010
  min_seller_rating: 4.2

payout_rules:
  fixed_transaction_fee_paise: 30
  min_payout_threshold_paise: 2500
  payout_frequency_days: 7
